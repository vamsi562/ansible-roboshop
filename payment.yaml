- name: payment setup
  hosts: payment
  become: true
  tasks:
    - name: install python and packages
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
        - python3
        - gcc
        - python3-devel

    - name: Create a new system user roboshop
      ansible.builtin.user:
        name: roboshop
        comment: "roboshop system user"
        system: true
        shell: /sbin/nologin
        home: /app
        state: present

    - name: remove directory if exists
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create a app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download payment app zip file
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
        dest: /tmp/payment.zip

    - name: Unzip file already existing on the remote server
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: Install from requirements file
      ansible.builtin.pip:
      requirements: requirements.txt
      executable: pip3

    - name: copy payment service file
      ansible.builtin.copy:
        src: payment.service
        dest: /etc/systemd/system/payment.service

    - name: systemd  reload config files
      ansible.builtin.systemd_service:
        name: payment
        state: started
        enabled: true
        daemon_reload: true
