- name: shipping setup
  hosts: shipping
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: install maven
      ansible.builtin.package:
        name: maven
        state: present

    - name: Create a new system user roboshop
      ansible.builtin.user:
        name: roboshop
        comment: "roboshop system user"
        system: true
        shell: /sbin/nologin
        home: /app
        state: present

    - name: remove directory if exists
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create a app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download shipping app zip file
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
        dest: /tmp/shipping.zip

    - name: Unzip file already existing on the remote server
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: run maven commands
      ansible.builtin.command: mvn clean package
      args:
        chdir: /app
    
    - name: copy jar file
      ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
      args:
        chdir: /app

    - name: copy shipping service file
      ansible.builtin.copy:
        src: shipping.service
        dest: /etc/systemd/system/shipping.service
    
    - name: Install mysql
      ansible.builtin.package:
        name: mysql
        state: present

    - name: Install Python 3 and MySQL connector dependencies
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
        state: present

    - name: install PyMySQL for Python 3
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3

    - name: run sql commands
      community.mysql.mysql_db:
        login_user: root
        login_password: RoboShop@1
        name: all
        state: import
        login_host: mysql.chikoo.fun
        target: "{{ item }}"
      loop:
        - /app/db/schema.sql
        - /app/db/app-user.sql 
        - /app/db/master-data.sql

    - name: systemd  reload config files
      ansible.builtin.systemd_service:
        name: shipping
        state: started
        enabled: true
        daemon_reload: true